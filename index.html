        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg-color);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            backdrop-filter: blur(15px); /* Эффект матового стекла */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 25px 25px 25px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(138, 43, 226, 0.15);
            position: relative;
        }
        
        /* Исправление смещения кнопок и заголовков */
        .lang-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            gap: 10px;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            background: var(--gold-gradient);
            color: #000000;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
        }

        /* Выравнивание по центру */
        h1 {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .method-subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 0px;
            margin-bottom: 30px;
            font-style: italic;
            display: block;
            width: 100%;
        }

            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #e2d5f3;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 15px;
            background-color: rgba(12, 5, 23, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: var(--gold-solid);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
            background-color: rgba(12, 5, 23, 0.8);
        }

            padding: 16px;
            background: var(--gold-gradient);
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;

            font-weight: 800;
            margin-bottom: 5px;

            font-size: 13px;
            margin-top: 6px;

</head>

let currentLang = 'ru';

currentLang = lang;
document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
document.getElementById('main-title').innerText = i18n[lang].title;
document.getElementById('method-text').innerText = i18n[lang].method;
document.getElementById('lbl-date').innerText = i18n[lang].lblDate;
document.getElementById('lbl-year').innerText = i18n[lang].lblYear;
document.getElementById('btn-submit').innerText = i18n[lang].btnSubmit;
document.getElementById('res-bot-link').innerText = i18n[lang].botText;
document.getElementById('res-bot-link').href = i18n[lang].botUrl;
const resBox = document.getElementById('result');
if (resBox.style.display === 'block') {
const currentNum = document.getElementById('res-num').innerText;
if (interpretations[lang][currentNum]) {
document.getElementById('res-title').innerText = interpretations[lang][currentNum].title;

    function calculateEnergy() {
        const dateInput = document.getElementById('birthdate').value;
        const yearInput = document.getElementById('targetyear').value;
        const errorText = document.getElementById('error-text');
        const resBox = document.getElementById('result');

        if (!dateInput || !yearInput) {
            errorText.innerText = i18n[currentLang].errorEmpty;
            errorText.style.display = 'block';
            resBox.style.display = 'none';
            return;
        }

        errorText.style.display = 'none';

        const birthDate = new Date(dateInput);
        const day = birthDate.getDate();
        const month = birthDate.getMonth() + 1; // В JS месяцы от 0 до 11
        const targetYear = parseInt(yearInput);

        // ====== УМНАЯ ЛОГИКА СОЛЯРНОГО ГОДА ======
        // Создаем дату рождения в интересующем пользователя году
        const birthdayInTargetYear = new Date(targetYear, month - 1, day);
        
        // Создаем текущую дату (когда пользователь нажал кнопку прямо сейчас)
        const today = new Date();
        
        let calculatedSolarYear = targetYear;

        // Если пользователь делает прогноз на ТЕКУЩИЙ календарный год:
        if (targetYear === today.getFullYear()) {
            // Если его день рождения в этом году ЕЩЕ НЕ НАСТУПИЛ, то его солярный год равен прошлому году
            if (today < birthdayInTargetYear) {
                calculatedSolarYear = targetYear - 1;
            }
        } 
        // Если пользователь делает прогноз на БУДУЩИЙ год (например, на январь следующего года):
        else if (targetYear > today.getFullYear()) {
            // Мы предполагаем базовый солярный сдвиг для начала того года, пока не наступил день рождения
            // (В нумерологии, если смотрят январь-февраль будущего года до ДР, берут прошлый соляр)
            calculatedSolarYear = targetYear - 1;
        }

        // Функция приведения числа к однозначному (от 1 до 9)
        function reduceToSingleDigit(num) {
            while (num > 9) {
                num = num.toString().split('').reduce((sum, digit) => sum + parseInt(digit), 0);
            }
            return num;
        }

        // Расчет по солярному году: День + Месяц + Правильный солярный год
        const sum = day + month + calculatedSolarYear;
        const finalEnergy = reduceToSingleDigit(sum);

        // Вывод результатов на экран
        document.getElementById('res-num').innerText = finalEnergy;
        document.getElementById('res-title').innerText = interpretations[currentLang][finalEnergy].title;
        document.getElementById('res-desc').innerText = interpretations[currentLang][finalEnergy].desc;
        document.getElementById('res-cta').innerText = interpretations[currentLang][finalEnergy].cta;

        resBox.style.display = 'block';
        resBox.scrollIntoView({ behavior: 'smooth' });
    }
</script>
